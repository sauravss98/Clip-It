[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "game-clipper"
version = "0.1.0"
description = "Find action moments in no-commentary gaming videos from game audio alone and export them as clips."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saurav S" }]
keywords = ["gaming", "highlights", "clips", "ffmpeg", "youtube-shorts", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# Local vision reranker (CLIP). For NVIDIA GPUs install the CUDA build of torch first.
vision = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
]
# Read kill feeds / banners on screen (local CPU OCR, no torch needed).
ocr = ["rapidocr_onnxruntime>=1.3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
game-clipper = "game_clipper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/game_clipper"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
