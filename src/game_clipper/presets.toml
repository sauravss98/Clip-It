# Built-in presets for game-clipper.
#
# Resolution order (later wins):
#   [defaults] here -> [defaults] in --config -> [presets.<name>] here
#   -> [presets.<name>] in --config -> CLI flags
#
# Score units: "sustained" is dB above the rolling baseline / 10 and "transient" is
# the dB jump over the previous few seconds / 10, so a window score of 0.6 means
# roughly "6 dB louder than usual" once the weights are applied.

[defaults]
description = "Balanced settings for most games."

# Feature extraction
sample_rate = 16000          # Hz; game audio cues live well below 8 kHz
window = 0.5                 # seconds per analysis window

# Baseline (adapts to each recording's overall volume)
baseline_seconds = 90.0
baseline_percentile = 40.0

# Scores
w_sustained = 0.6
w_transient = 0.4
transient_lookback = 3.0     # seconds compared against for sudden jumps
threshold = 0.6              # minimum window score needed to start an event
max_flagged = 0.08           # adaptive cap: flag at most this fraction of the recording
sustain_window = 2.0         # seconds of loudness averaged for the sustained score

# Music / radio suppression
music_floor_db = 6.0         # dB above the quiet floor that counts as "loud"
music_min_len = 20.0         # loud stretches longer than this may be music
music_max_std_db = 4.0       # ...if their loudness varies less than this
music_penalty = 0.3          # 0 = off, 1 = fully suppress steady music
tonal_penalty = 0.0          # penalty for stretches far more tonal than the rest of the video

# Events
merge_gap = 4.0              # merge flagged regions closer than this (s)
pad_before = 6.0
pad_after = 4.0
min_len = 8.0
max_len = 60.0
top = 20

# On-screen text: kill feed, chat and banners, read with local OCR ([ocr] extra).
# Regions are [x0, y0, x1, y1] fractions of the frame (optionally + scale, min_text_px:
# read the region shrunk by `scale`, skipping text lines shorter than min_text_px).
# Only these regions are read, which keeps OCR fast.
# text_events maps a phrase to its clip score, or {score, cooldown, team}. OCR typos are
# tolerated. With player_name set, lines starting with your name get a bonus and other
# players' kills are discounted, except team moments (team = true).
text_scan = false
text_interval = 3.0          # seconds between samples (chat lines stay up ~10 s)
player_name = ""             # your in-game name: your own kills get a bonus

[presets.generic]
description = "Balanced settings for most games."

[presets.fortnite]
description = "Fortnite: sustained build-fights and gunfights."
w_sustained = 0.65
w_transient = 0.35
merge_gap = 5.0
text_scan = true
text_interval = 2.5          # elimination popups are brief
text_regions = [
    [0.0, 0.30, 0.40, 0.70],                # kill feed (left)
    [0.20, 0.10, 0.80, 0.80, 0.5, 10.0],    # elimination popup, VICTORY ROYALE
]

[presets.fortnite.text_events]
"victory royale" = { score = 100, cooldown = 300, team = true }
"eliminated" = 70
"knocked" = 55

[presets.league]
description = "League of Legends: long teamfights, lots of ability noise."
w_sustained = 0.75
w_transient = 0.25
threshold = 0.55
baseline_seconds = 120.0
merge_gap = 6.0
text_scan = true
text_interval = 5.0          # kill lines stay in chat for ~10 s
text_regions = [
    [0.0, 0.40, 0.45, 0.88],                # chat / kill announcements (bottom left)
    [0.25, 0.15, 0.75, 0.60, 0.5, 18.0],    # VICTORY banner: big text only
]

[presets.league.text_events]
"penta kill" = 100
"quadra kill" = 95
"triple kill" = 90
"ally team has scored an ace" = { score = 80, team = true }
"double kill" = 65
"first blood" = 60
"shut down" = 45
"victory" = { score = 88, cooldown = 300, team = true }

[presets.r6siege]
description = "Rainbow Six Siege: quiet tactical play, then sharp gunfire and breaches."
w_sustained = 0.3
w_transient = 0.7
threshold = 0.55
baseline_percentile = 30.0
transient_lookback = 4.0
merge_gap = 3.0

[presets.gta5_online]
description = "GTA 5 Online: gunfights and crashes; suppresses car radio and cutscene music."
w_sustained = 0.45
w_transient = 0.55
music_penalty = 0.75
tonal_penalty = 0.5
music_min_len = 12.0
text_scan = true
text_regions = [[0.15, 0.25, 0.85, 0.65, 0.5, 18.0]]

[presets.gta5_online.text_events]
"mission passed" = { score = 80, cooldown = 120, team = true }
"heist passed" = { score = 90, cooldown = 120, team = true }

[presets.gta6]
description = "GTA 6 (PS5 captures): like GTA 5 Online, tuned for louder mixes."
w_sustained = 0.45
w_transient = 0.55
threshold = 0.65
music_penalty = 0.75
tonal_penalty = 0.5
music_min_len = 12.0
